name: Test build_pyoptsparse.snopt_module

on:
  # Trigger on push or pull request events for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # # Run the workflow Sundays at 0400 UTC
  # schedule:
  #   - cron: '0 4 * * 0'

  # Allow running the workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      run_name:
        description: 'Name of workflow run as it will appear under Actions tab (optional):'
        type: string
        required: false
        default: ''
      debug_enabled:
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        type: boolean
        required: false
        default: false

concurrency:
  # Cancel any existing CI runs if we push to this branch
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

run-name:  ${{ inputs.run_name }}

jobs:

  test-build-snopt-module:

    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        pixi-environment: ['default', 'py311', 'py312', 'py314']

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        # Note this isn't passed to the composite action
        shell: bash -l {0}

    name: ${{ matrix.os }} / Python ${{ matrix.pixi-environment }}

    env:
      HAS_SNOPT_ACCESS: ${{ secrets.OPENMDAO_ACTIONS_SUPPORT_DEPLOY_KEY != '' && secrets.SNOPT_SRC_GPG_PASSPHRASE != '' }}

    steps:
      - name: Display run details
        run: |
          echo "============================================================="
          echo "Run #${GITHUB_RUN_NUMBER}"
          echo "Run ID: ${GITHUB_RUN_ID}"
          echo "Testing: ${GITHUB_REPOSITORY}"
          echo "Triggered by: ${GITHUB_EVENT_NAME}"
          echo "Initiated by: ${GITHUB_ACTOR}"
          echo "OS: ${{ matrix.os }}"
          echo "Pixi environment: ${{ matrix.pixi-environment }}"
          echo "============================================================="

      - name: Checkout code
        uses: actions/checkout@v7

      # SNOPT source is proprietary and lives gpg-encrypted in the private
      # OpenMDAO/_openmdao_actions_support repo, checked out here read-only via a
      # deploy key. See that repo's README for details on the secrets involved.
      - name: Checkout SNOPT source support repo
        if: env.HAS_SNOPT_ACCESS == 'true'
        uses: actions/checkout@v7
        with:
          repository: OpenMDAO/_openmdao_actions_support
          ssh-key: ${{ secrets.OPENMDAO_ACTIONS_SUPPORT_DEPLOY_KEY }}
          path: _actions_support

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: false
          environments: ${{ matrix.pixi-environment }}

      - name: Install build_pyoptsparse
        run: |
          echo "============================================================="
          echo "Install build_pyoptsparse in pixi environment"
          echo "============================================================="
          pixi run --frozen -e ${{ matrix.pixi-environment }} pip install -e .

      - name: Display environment
        run: |
          echo "============================================================="
          echo "Pixi environment info"
          echo "============================================================="
          pixi info
          pixi list -e ${{ matrix.pixi-environment }}

      - name: Decrypt SNOPT source files
        if: env.HAS_SNOPT_ACCESS == 'true'
        env:
          SNOPT_SRC_GPG_PASSPHRASE: ${{ secrets.SNOPT_SRC_GPG_PASSPHRASE }}
        run: |
          echo "============================================================="
          echo "Decrypting SNOPT 7.7 source files from _openmdao_actions_support"
          echo "============================================================="
          mkdir -p SNOPT/src
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$SNOPT_SRC_GPG_PASSPHRASE" \
            -o SNOPT/snopt_src.tar.xz \
            -d _actions_support/snopt/snopt_src.tar.xz.gpg
          tar -xJf SNOPT/snopt_src.tar.xz -C SNOPT/src --strip-components=1
          rm -f SNOPT/snopt_src.tar.xz
          ls -la SNOPT/src

      - name: Build SNOPT module
        if: env.HAS_SNOPT_ACCESS == 'true'
        env:
          FC: ${{ runner.os == 'Windows' && 'ifx' || 'gfortran' }}
          CC: ${{ runner.os == 'Windows' && 'cl' || 'gcc' }}
        run: |
          echo "============================================================="
          echo "Build SNOPT module with build_pyoptsparse"
          echo "============================================================="
          pixi run --frozen -e ${{ matrix.pixi-environment }} python -m build_pyoptsparse.snopt_module SNOPT/src

      - name: Test SNOPT module (Unix)
        if: env.HAS_SNOPT_ACCESS == 'true' && runner.os != 'Windows'
        run: |
          echo "============================================================="
          echo "Test that SNOPT module can be imported"
          echo "============================================================="
          pixi run --frozen -e ${{ matrix.pixi-environment }} python -c "from pyoptsparse import SNOPT; print('SNOPT loaded successfully!')"

          echo "============================================================="
          echo "Test SNOPT optimization"
          echo "============================================================="
          export SNOPT_SRC_PATH="SNOPT/src"
          echo $PWD
          ls -la
          pixi run --frozen -e ${{ matrix.pixi-environment }} python -m unittest build_pyoptsparse/test/test_snopt_module.py

      - name: Test SNOPT module (Windows)
        if: env.HAS_SNOPT_ACCESS == 'true' && runner.os == 'Windows'
        shell: cmd
        run: |
          echo =============================================================
          echo Test that SNOPT module can be imported
          echo =============================================================
          echo Attempting to load snopt.pyd with detailed error info
          pixi run --frozen -e ${{ matrix.pixi-environment }} python -c "from pyoptsparse import OPT; opt = OPT('SNOPT'); print('Success!')"

          echo =============================================================
          echo Test SNOPT optimization
          echo =============================================================
          pixi run --frozen -e ${{ matrix.pixi-environment }} python -m unittest build_pyoptsparse/test/test_snopt_module.py

      # Enable tmate debugging of manually-triggered workflows if the input option was provided
      - name: Setup tmate session
        if: github.event_name == 'workflow_dispatch' && inputs.debug_enabled
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: Setup tmate session after failure
        if: github.event_name == 'workflow_dispatch' && inputs.debug_enabled && failure()
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: true

      - name: Notify slack on failure
        uses: act10ns/slack@v2.2.0
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          status: ${{ job.status }}
        if: failure()
